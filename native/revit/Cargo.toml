[package]
name = "foreman-revit"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[dependencies]
rvt = { git = "https://github.com/DrunkOnJava/rvt-rs", rev = "120e2f9ffa8422ba437102c8d300b7e902cdde80" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
