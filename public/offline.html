<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ForemanHQ offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        align-items: center;
        background: #f9fafb;
        color: #111827;
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        max-width: 34rem;
      }

      h1 {
        font-size: 1.5rem;
        line-height: 1.2;
        margin: 0 0 0.75rem;
      }

      p {
        color: #4b5563;
        font-size: 1rem;
        line-height: 1.5;
        margin: 0;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111827;
          color: #f9fafb;
        }

        p {
          color: #d1d5db;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ForemanHQ is offline</h1>
      <p>
        Open the app once while online to refresh the offline dashboard, then it
        can load jobs, material lists, and cached part photos without a
        connection.
      </p>
    </main>
  </body>
</html>
