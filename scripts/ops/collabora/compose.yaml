name: foremanhq-collabora

services:
  editor:
    # CODE 26.04.4.2.1; immutable registry reference.
    image: collabora/code@sha256:4e983196eb9878f339cc506c38c21f1cc3473bca3d6de883c5de08f9c0cc3a6c
    user: "1001:1001"
    restart: unless-stopped
    stop_grace_period: 120s
    ports:
      # TLS terminates at a reverse proxy on this same host.
      - "127.0.0.1:9980:9980"
    environment:
      DONT_GEN_SSL_CERT: "1"
    volumes:
      - type: volume
        source: editor-config
        target: /etc/coolwsd
        read_only: true
    # Retain Docker's default capability bounding set and seccomp policy.
    # The image's file capabilities allow its UID-1001 process to isolate kits.
    # Do not add privileged, SYS_ADMIN, seccomp=unconfined, or host networking.
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/bin/coolwsd", "--probe", "--use-env-vars"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  editor-config:
    external: true
    name: foremanhq-collabora-config
